<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GARDEN HUNTER</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; background: #0a0f0a; touch-action: none; }
        .ui-layer { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; background: rgba(0,0,0,0.85); z-index: 100; }
        .btn { padding: 15px 35px; font-size: 20px; background: #00ffcc; border: none; border-radius: 30px; cursor: pointer; margin: 10px; font-weight: bold; color: #000; }
        #stats { position: absolute; top: 15px; left: 15px; color: #0f0; font-size: 22px; z-index: 50; text-shadow: 2px 2px #000; }
        #p-btn { position: absolute; top: 15px; right: 15px; width: 45px; height: 45px; background: rgba(0,255,204,0.2); border: 2px solid #00ffcc; color: #00ffcc; border-radius: 50%; z-index: 50; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="stats">Score: <span id="sc">0</span></div>
    <button id="p-btn" onclick="tPause()">II</button>

    <div id="start-menu" class="ui-layer">
        <h1 style="color:#00ffcc; font-size: 40px;">GARDEN HUNTER</h1>
        <button class="btn" onclick="sGame()">戦闘開始</button>
        <button class="btn" style="background:#ffcc00" onclick="alert('【図鑑】\n01:テントウムシ (弱)\n02:カ (速)\n03:黒い悪魔 (強)')">図鑑を見る</button>
    </div>

    <div id="pause-menu" class="ui-layer" style="display:none">
        <h1 style="color:#ffcc00">PAUSED</h1>
        <button class="btn" onclick="tPause()">再開する</button>
    </div>

    <canvas id="g"></canvas>
    <audio id="sd1" src="spray_long.mp3" loop></audio>
    <audio id="sd2" src="bomb.mp3"></audio>

    <script>
        const cvs=document.getElementById('g'), ctx=cvs.getContext('2d');
        let active=false, paused=false, score=0, keys={}, enemies=[], bullets=[], lastSpawn=0;
        let p = {x:0, y:0, r:25, a:0};
        
        const imgP=new Image(); imgP.src='spray.png';
        const imgE=new Image(); imgE.src='01.png'; // 确保你的仓库里有 01.png

        cvs.width=window.innerWidth; cvs.height=window.innerHeight;

        window.onkeydown=e=>{ keys[e.code]=true; if(e.code==='Escape') tPause(); };
        window.onkeyup=e=>{ keys[e.code]=false; if(e.code==='Space') document.getElementById('sd1').pause(); };
        
        // 手机触摸修复
        cvs.addEventListener('touchstart', e=>{ 
            if(active && !paused){
                e.preventDefault();
                keys['Space']=true; 
                p.x=e.touches[0].clientX; p.y=e.touches[0].clientY; 
            }
        }, {passive: false});
        cvs.addEventListener('touchmove', e=>{ 
            if(active && !paused){
                e.preventDefault();
                p.x=e.touches[0].clientX; p.y=e.touches[0].clientY; 
            }
        }, {passive: false});
        cvs.addEventListener('touchend', ()=>{ keys['Space']=false; document.getElementById('sd1').pause(); });

        function tPause() { if(!active) return; paused=!paused; document.getElementById('pause-menu').style.display=paused?'flex':'none'; if(paused) document.getElementById('sd1').pause(); }
        
        function sGame() { 
            active=true; 
            document.getElementById('start-menu').style.display='none'; 
            p.x=cvs.width/2; p.y=cvs.height/2; 
            score=0; enemies=[]; bullets=[];
            requestAnimationFrame(loop); 
        }

        function loop(ts) {
            if(!active) return;
            if(!paused) {
                // 每隔 1000 毫秒生成一个怪物
                if(ts - lastSpawn > 1000) {
                    enemies.push({
                        x: Math.random()*cvs.width, 
                        y: -50, 
                        hp: 3, 
                        speed: 2 + Math.random()*2 
                    });
                    lastSpawn = ts;
                }

                // 键盘移动
                if(keys.KeyW || keys.ArrowUp) p.y-=6;
                if(keys.KeyS || keys.ArrowDown) p.y+=6;
                if(keys.KeyA || keys.ArrowLeft) p.x-=6;
                if(keys.KeyD || keys.ArrowRight) p.x+=6;
                
                p.a += 0.08; // 自动旋转喷雾器

                // 发射子弹
                if(keys.Space) { 
                    document.getElementById('sd1').play();
                    if(Math.random()>0.7) {
                        bullets.push({x:p.x, y:p.y, vx:Math.cos(p.a)*12, vy:Math.sin(p.a)*12, life:1});
                    }
                }

                // 更新子弹
                for(let i=bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx; b.y += b.vy; b.life -= 0.02;
                    if(b.life <= 0) bullets.splice(i,1);
                }

                // 更新怪物
                for(let i=enemies.length-1; i>=0; i--) {
                    let e = enemies[i];
                    e.y += e.speed;

                    // 碰撞检测
                    bullets.forEach(b => {
                        let dist = Math.sqrt((b.x-e.x)**2 + (b.y-e.y)**2);
                        if(dist < 30) { e.hp -= 1; b.life = 0; }
                    });

                    if(e.hp <= 0) {
                        enemies.splice(i,1);
                        score += 10;
                        document.getElementById('sc').innerText = score;
                        let s2 = document.getElementById('sd2'); s2.currentTime=0; s2.play();
                    }

                    if(e.y > cvs.height) enemies.splice(i,1);
                }
            }

            // 绘图
            ctx.clearRect(0,0,cvs.width,cvs.height);
            
            // 画子弹
            ctx.fillStyle='#0f0';
            bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill(); });

            // 画怪物
            enemies.forEach(e => { ctx.drawImage(imgE, e.x-25, e.y-25, 50, 50); });

            // 画玩家
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.a);
            ctx.drawImage(imgP, -30, -30, 60, 60);
            ctx.restore();

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
