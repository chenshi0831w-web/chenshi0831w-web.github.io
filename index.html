<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>害虫ハンター：ガーデン最終決戦</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0f0a; font-family: sans-serif; -webkit-user-select: none; user-select: none; }
        canvas { display: block; touch-action: none; background: url('background.jpg') no-repeat center center; background-size: cover; }
        
        /* 这里的 z-index 我设到了 9999，保证它在最前面 */
        .overlay { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            color: #fff; z-index: 1000; text-align: center; 
        }

        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; z-index: 100; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; }
        #hp-ui { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 100; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        
        /* 强制按钮样式 */
        .menu-btn { 
            padding: 15px 30px; font-size: 20px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; 
        }
        .start-btn { background: #00ffcc; color: #000; }
        .book-btn { background: #ff4444; color: #fff; } /* 改成红色，一眼就能看到 */

        #pause-btn {
            position: absolute; bottom: 20px; right: 20px; width: 50px; height: 50px;
            background: rgba(0, 255, 204, 0.3); border: 2px solid #00ffcc;
            border-radius: 50%; color: #00ffcc; display: flex; justify-content: center; align-items: center; z-index: 100;
        }

        .book-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-height: 50vh; overflow-y: auto; padding: 10px; }
        .bug-card { background: rgba(255,255,255,0.1); border: 1px solid #00ffcc; border-radius: 10px; padding: 10px; width: 140px; }
        .bug-card img { width: 50px; height: 50px; }

        .heart { width: 15px; height: 15px; background: #ff66cc; position: relative; transform: rotate(-45deg); }
        .heart::before, .heart::after { content: ''; width: 15px; height: 15px; background: #ff66cc; border-radius: 50%; position: absolute; }
        .heart::before { top: -8px; left: 0; } .heart::after { top: 0; left: 8px; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="s">0</span></div>
    <div id="hp-ui"></div>
    <div id="pause-btn" onclick="togglePause()">II</div>

    <!-- 开始界面 -->
    <div id="overlay-start" class="overlay">
        <h1 style="color: #00ffcc;">GARDEN HUNTER</h1>
        <div class="btn-group">
            <button class="menu-btn start-btn" onclick="startGame()">戦闘開始</button>
            <button class="menu-btn book-btn" onclick="showBook()">図鑑</button>
        </div>
    </div>

    <!-- 图鉴界面 -->
    <div id="encyclopedia" class="overlay" style="display: none;">
        <h2 style="color: #ffcc00;">昆虫図鑑</h2>
        <div class="book-container" id="book-list"></div>
        <button class="menu-btn" style="background:#fff; margin-top:10px;" onclick="hideBook()">閉じる</button>
    </div>

    <!-- 暂停界面 -->
    <div id="overlay-pause" class="overlay" style="display: none;">
        <h1>PAUSED</h1>
        <button class="menu-btn start-btn" onclick="togglePause()">再開</button>
    </div>

    <!-- 结算界面 -->
    <div id="gameover-screen" class="overlay" style="display: none;">
        <h2>GAME OVER</h2>
        <p>SCORE: <span id="final-score">0</span></p>
        <button class="menu-btn start-btn" onclick="location.reload()">タイトルへ</button>
    </div>

    <canvas id="g"></canvas>
    <audio id="snd-spray" src="spray_long.mp3"></audio>
    <audio id="snd-bomb" src="bomb.mp3"></audio>

    <script src="frog.js"></script>
    <script>
        const cvs = document.getElementById('g'), ctx = cvs.getContext('2d');
        const sEl = document.getElementById('s'), hpEl = document.getElementById('hp-ui');
        const imgP = new Image(); imgP.src = 'spray.png';
        const imgE1 = new Image(); imgE1.src = '01.png';
        const imgE2 = new Image(); imgE2.src = '02.png';
        const imgBoss = new Image(); imgBoss.src = '03.png';

        const bugData = [
            { name: 'テントウムシ', img: '01.png', desc: '基本害虫' },
            { name: 'カ', img: '02.png', desc: 'スピード型' },
            { name: '黒い悪魔', img: '03.png', desc: 'ボス' }
        ];

        let score, active=false, paused=false, keys={}, bullets=[], enemies=[], lastSpawn, pHP, pInvuln, p={x:0,y:0,r:25,spd:7,angle:0,lf:0};

        cvs.width = window.innerWidth; cvs.height = window.innerHeight;

        // 控制逻辑
        window.onkeydown = e => { keys[e.code]=true; if(e.code==='Escape') togglePause(); };
        window.onkeyup = e => { keys[e.code]=false; if(e.code==='Space') document.getElementById('snd-spray').pause(); };
        cvs.addEventListener('touchstart', e => { if(active && !paused){ keys['Space']=true; p.x=e.touches[0].clientX; p.y=e.touches[0].clientY; } }, {passive:false});
        cvs.addEventListener('touchend', () => { keys['Space']=false; document.getElementById('snd-spray').pause(); });
        cvs.addEventListener('touchmove', e => { if(active && !paused){ p.x=e.touches[0].clientX; p.y=e.touches[0].clientY; } }, {passive:false});

        function showBook() {
            document.getElementById('encyclopedia').style.display = 'flex';
            const list = document.getElementById('book-list');
            list.innerHTML = '';
            bugData.forEach(b => {
                list.innerHTML += `<div class="bug-card"><img src="${b.img}"><h4>${b.name}</h4><p style="font-size:12px">${b.desc}</p></div>`;
            });
        }
        function hideBook() { document.getElementById('encyclopedia').style.display = 'none'; }

        function togglePause() {
            if(!active) return;
            paused = !paused;
            document.getElementById('overlay-pause').style.display = paused ? 'flex' : 'none';
            if(paused) document.getElementById('snd-spray').pause();
        }

        function startGame() {
            document.getElementById('overlay-start').style.display = 'none';
            score=0; bullets=[]; enemies=[]; pHP=3; pInvuln=0; active=true; paused=false;
            p.x=cvs.width/2; p.y=cvs.height/2;
            updateHP(); lastSpawn=performance.now();
            requestAnimationFrame(loop);
        }

        function updateHP() { hpEl.innerHTML = ''; for(let i=0;i<pHP;i++) hpEl.innerHTML += '<div class="heart"></div>'; }

        function loop(ts) {
            if(!active) return;
            if(paused) { requestAnimationFrame(loop); return; }

            if(ts - lastSpawn > 1000) {
                let en = {x: Math.random()*cvs.width, y:-50, sz:50, hp:3, spd:2, img:imgE1};
                enemies.push(en); lastSpawn = ts;
            }

            if(keys.KeyW) p.y-=p.spd; if(keys.KeyS) p.y+=p.spd; if(keys.KeyA) p.x-=p.spd; if(keys.KeyD) p.x+=p.spd;
            p.angle += 0.05;

            if(keys.Space) {
                document.getElementById('snd-spray').play();
                if(ts - p.lf > 100) {
                    bullets.push({x:p.x, y:p.y, vx:Math.cos(p.angle)*10, vy:Math.sin(p.angle)*10, life:1});
                    p.lf = ts;
                }
            }

            ctx.clearRect(0,0,cvs.width,cvs.height);
            bullets.forEach((b,i) => {
                b.x+=b.vx; b.y+=b.vy; b.life-=0.02;
                ctx.fillStyle="#0f0"; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,7); ctx.fill();
                if(b.life<=0) bullets.splice(i,1);
            });

            enemies.forEach((e,i) => {
                e.y += e.spd;
                ctx.drawImage(e.img, e.x, e.y, e.sz, e.sz);
                if(Math.sqrt((p.x-e.x)**2+(p.y-e.y)**2) < 40 && pInvuln<=0) { pHP--; updateHP(); pInvuln=100; if(pHP<=0) active=false; }
            });

            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
            ctx.drawImage(imgP, -30, -30, 60, 60); ctx.restore();
            
            if(!active) {
                document.getElementById('final-score').innerText = score;
                document.getElementById('gameover-screen').style.display = 'flex';
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
